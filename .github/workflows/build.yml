name: Build Eq APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD are not set"
            exit 1
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/eq-release.jks
            cat > keystore.properties <<EOF
          storeFile=../keystore/eq-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=eq
          keyPassword=$KEYSTORE_PASSWORD
          EOF
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Rename release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: cp app/build/outputs/apk/release/app-release.apk "Eq-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Eq $TAG" --generate-notes
          gh release upload "$TAG" "Eq-${TAG}.apk" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload APK artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: Eq-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
